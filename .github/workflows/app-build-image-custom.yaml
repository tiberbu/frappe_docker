name: App / Build Image Custom

on:
  workflow_call:
    inputs:
      app_name:
        required: false
        type: string
        description: "App module and image name, for example 'crm'. Optional when apps_json_base64 is provided (used only for smoke test if set)."
      app_repo:
        required: false
        type: string
        description: "Git URL or GitHub slug for the app repository. Ignored when apps_json_base64 is provided."
      app_ref:
        required: false
        type: string
        description: "Git branch or tag to install for the app. Ignored when apps_json_base64 is provided."
      apps_json_base64:
        required: false
        type: string
        description: "Base64-encoded apps.json for multi-app builds. When provided, overrides app_repo/app_ref."
      frappe_ref:
        required: true
        type: string
        description: "Tag of the existing frappe/base and frappe/build images, for example version-16"
      frappe_image_prefix:
        required: false
        type: string
        default: frappe
        description: "Image prefix for existing base and build images, for example 'frappe' or 'ghcr.io/frappe'"
      image_name:
        required: true
        type: string
        description: "Full image name, for example ghcr.io/frappe/crm or 123456789012.dkr.ecr.eu-west-2.amazonaws.com/support-uat"
      image_tag:
        required: true
        type: string
        description: "Image tag, for example develop or v16.0.0"
      push:
        required: true
        type: boolean
      registry:
        required: false
        type: string
        default: docker.io
        description: "Registry type: 'ghcr.io', 'docker.io', 'ecr', or any custom registry hostname"
      frappe_repo:
        required: false
        type: string
        default: https://github.com/frappe/frappe
        description: "Git URL for the Frappe framework repository"
      builder_repository:
        required: false
        type: string
        default: frappe/frappe_docker
        description: "Repository that contains the Containerfile and helper scripts"
      builder_ref:
        required: false
        type: string
        default: main
        description: "Ref to checkout from the builder repository"
      platforms:
        required: false
        type: string
        default: linux/amd64
        description: "Docker platforms for the final build"
      aws_role_arn:
        required: false
        type: string
        description: "IAM role ARN for ECR OIDC authentication. Required when registry is 'ecr'."
      aws_region:
        required: false
        type: string
        default: eu-west-2
        description: "AWS region for ECR. Required when registry is 'ecr'."
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: app-image-${{ github.repository }}-${{ inputs.app_name || 'multi' }}-${{ inputs.frappe_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDER_DIR: builder
      APPS_JSON_PATH: builder/.github/tmp/apps.json
      CACHE_SCOPE: app-image-${{ inputs.app_name || 'multi' }}-${{ inputs.frappe_ref }}
      TEST_IMAGE: local/app-image:${{ github.run_id }}-${{ github.run_attempt }}
      FINAL_IMAGE: ${{ inputs.image_name }}:${{ inputs.image_tag }}

    steps:
      - name: Validate inputs
        env:
          APPS_JSON_BASE64: ${{ inputs.apps_json_base64 }}
          APP_REPO: ${{ inputs.app_repo }}
          APP_NAME: ${{ inputs.app_name }}
          REGISTRY: ${{ inputs.registry }}
          AWS_ROLE_ARN: ${{ inputs.aws_role_arn }}
        run: |
          if [ -z "$APPS_JSON_BASE64" ]; then
            if [ -z "$APP_REPO" ]; then
              echo "::error::Either apps_json_base64 or app_repo must be provided."
              exit 1
            fi
            if [ -z "$APP_NAME" ]; then
              echo "::error::app_name is required when apps_json_base64 is not provided."
              exit 1
            fi
          fi
          if [ "$REGISTRY" = "ecr" ] && [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::aws_role_arn is required when registry is 'ecr'."
            exit 1
          fi

      - name: Checkout builder repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.builder_repository }}
          ref: ${{ inputs.builder_ref }}
          path: ${{ env.BUILDER_DIR }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create apps.json
        env:
          APP_REPO: ${{ inputs.app_repo }}
          APP_REF: ${{ inputs.app_ref }}
          APPS_JSON_BASE64: ${{ inputs.apps_json_base64 }}
          APPS_JSON_PATH: ${{ env.APPS_JSON_PATH }}
        run: |
          mkdir -p "$(dirname "$APPS_JSON_PATH")"

          if [ -n "$APPS_JSON_BASE64" ]; then
            echo "Using provided apps_json_base64"
            printf '%s' "$APPS_JSON_BASE64" | base64 -d > "$APPS_JSON_PATH"
            echo "--- apps.json content ---"
            cat "$APPS_JSON_PATH"
            echo "-------------------------"
            exit 0
          fi

          echo "Building single-app apps.json from app_repo/app_ref"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repo = os.environ["APP_REPO"].strip()
          ref = os.environ["APP_REF"].strip()

          if repo.count("/") == 1 and not repo.startswith(("https://", "http://")):
              repo = f"https://github.com/{repo}"

          for prefix in ("refs/heads/", "refs/tags/"):
              if ref.startswith(prefix):
                  ref = ref.removeprefix(prefix)

          Path(os.environ["APPS_JSON_PATH"]).write_text(
              json.dumps([{"url": repo, "branch": ref}], indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILDER_DIR }}
          file: ${{ env.BUILDER_DIR }}/images/layered/Containerfile
          build-args: |
            FRAPPE_IMAGE_PREFIX=${{ inputs.frappe_image_prefix }}
            FRAPPE_PATH=${{ inputs.frappe_repo }}
            FRAPPE_BRANCH=${{ inputs.frappe_ref }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          load: true
          platforms: linux/amd64
          secrets: |
            id=apps_json,src=${{ env.APPS_JSON_PATH }}
          tags: ${{ env.TEST_IMAGE }}

      - name: Smoke test image contents
        env:
          APP_NAME: ${{ inputs.app_name }}
          TEST_IMAGE: ${{ env.TEST_IMAGE }}
        run: |
          if [ -n "$APP_NAME" ]; then
            docker run --rm --entrypoint bash "$TEST_IMAGE" -lc \
              "test -d /home/frappe/frappe-bench/apps/frappe && test -d /home/frappe/frappe-bench/apps/${APP_NAME}"
          else
            echo "No app_name provided (multi-app build); running generic smoke test."
            docker run --rm --entrypoint bash "$TEST_IMAGE" -lc \
              "test -d /home/frappe/frappe-bench/apps/frappe"
          fi

      - name: Configure AWS credentials
        if: ${{ inputs.push && inputs.registry == 'ecr' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to ECR
        if: ${{ inputs.push && inputs.registry == 'ecr' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        if: ${{ inputs.push && inputs.registry == 'ghcr.io' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to target registry
        if: ${{ inputs.push && inputs.registry != 'ghcr.io' && inputs.registry != 'ecr' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILDER_DIR }}
          file: ${{ env.BUILDER_DIR }}/images/layered/Containerfile
          build-args: |
            FRAPPE_IMAGE_PREFIX=${{ inputs.frappe_image_prefix }}
            FRAPPE_PATH=${{ inputs.frappe_repo }}
            FRAPPE_BRANCH=${{ inputs.frappe_ref }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          platforms: ${{ inputs.platforms }}
          push: true
          secrets: |
            id=apps_json,src=${{ env.APPS_JSON_PATH }}
          tags: ${{ env.FINAL_IMAGE }}
